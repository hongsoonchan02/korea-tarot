<style>
        .tarot-card {
            transition: transform 0.4s cubic-bezier(0.175, 0.885, 0.32, 1.275), box-shadow 0.4s ease;
            transform-origin: bottom center;
        }

            box-shadow: 0 0 25px rgba(208, 188, 255, 0.5);
            z-index: 50;
        }

        .tarot-card.selected {
            transform: translateY(-30px) scale(1.1);
            box-shadow: 0 0 30px rgba(208, 188, 255, 0.8);
            border: 2px solid #d0bcff;
            z-index: 40;
        }

        .tarot-card.disabled {
            opacity: 0.3;
            pointer-events: none;
            filter: grayscale(80%);
        }

        .spread-container {
            position: relative;
            height: 400px;
            display: flex;
            justify-content: center;
            align-items: flex-end;
            margin-top: 2rem;
            perspective: 1000px;
        }

        .card-wrapper {
            position: absolute;
            bottom: 0;
            transform-origin: bottom center;
        }

            background: rgba(20, 23, 46, 0.6);
            backdrop-filter: blur(12px);

<script>
        document.addEventListener('DOMContentLoaded', () => {
            const spreadContainer = document.getElementById('card-spread');
            const totalCards = 22;
            let selectedCards = [];
            const maxSelections = 3;
            const actionBtn = document.getElementById('action-btn');

            // Generate arc layout
            const radius = 600; // Adjust for wider/tighter arc
            const startAngle = -45; // degrees
            const endAngle = 45; // degrees
            const angleStep = (endAngle - startAngle) / (totalCards - 1);

            for (let i = 0; i < totalCards; i++) {
                const angle = startAngle + (angleStep * i);
                
                const wrapper = document.createElement('div');
                wrapper.className = 'card-wrapper group cursor-pointer';
                
                // Position calculations for arc
                // Using CSS transform for positioning to keep bottom origin intact
                wrapper.style.transform = `rotate(${angle}deg)`;
                // wrapper.style.left = `calc(50% - 40px)`;
                // wrapper.style.bottom = `-200px`;
                
                
                const card = document.createElement('div');
                card.className = 'tarot-card w-20 h-36 md:w-28 md:h-48 rounded-lg shadow-lg relative overflow-hidden card-back-pattern';
                card.dataset.index = i;
                
                // Add inner border detail
                const innerBorder = document.createElement('div');
                innerBorder.className = 'absolute inset-2 border border-secondary/20 rounded pointer-events-none flex items-center justify-center';
                
                // Add esoteric center symbol
                const centerSymbol = document.createElement('div');
                centerSymbol.className = 'w-8 h-8 rounded-full border border-primary/30 flex items-center justify-center';
                const innerDiamond = document.createElement('div');
                innerDiamond.className = 'w-4 h-4 bg-primary/20 rotate-45';
                centerSymbol.appendChild(innerDiamond);
                
                innerBorder.appendChild(centerSymbol);
                card.appendChild(innerBorder);
                
                // Selection Badge (hidden by default)
                const badge = document.createElement('div');
                badge.className = 'absolute -top-3 -right-3 w-8 h-8 rounded-full bg-primary text-on-primary font-label-sm text-label-sm flex items-center justify-center opacity-0 transition-opacity duration-300 shadow-glow-primary z-10';
                card.appendChild(badge);

                wrapper.appendChild(card);
                spreadContainer.appendChild(wrapper);

                // Interaction
                wrapper.addEventListener('click', () => handleCardSelect(card, badge));
            }

            function handleCardSelect(card, badge) {
                if (card.classList.contains('disabled')) return;

                const cardIndex = selectedCards.indexOf(card);

                if (cardIndex > -1) {
                    // Deselect
                    selectedCards.splice(cardIndex, 1);
                    card.classList.remove('selected');
                    badge.style.opacity = '0';
                    updateSelectionUI();
                } else {
                    // Select
                    if (selectedCards.length < maxSelections) {
                        selectedCards.push(card);
                        card.classList.add('selected');
                        badge.style.opacity = '1';
                        updateSelectionUI();
                    }
                }
            }

            function updateSelectionUI() {
                // Update badges on cards
                selectedCards.forEach((c, idx) => {
                    const badge = c.querySelector('.absolute.-top-3');
                    if(badge) badge.textContent = idx + 1;
                });

                // Update Tracker Slots
                for (let i = 1; i <= 3; i++) {
                    const slot = document.getElementById(`slot-${i}`);
                    if (selectedCards[i - 1]) {
                        slot.classList.add('border-solid', 'bg-surface-bright', 'border-primary');
                        slot.classList.remove('border-dashed', 'bg-surface-container-high', 'border-outline-variant');
                        slot.innerHTML = `<div class="w-full h-full card-back-pattern rounded-md m-1 flex items-center justify-center"><span class="font-headline-md text-on-primary">${i}</span></div>`;
                    } else {
                        slot.classList.remove('border-solid', 'bg-surface-bright', 'border-primary');
                        slot.classList.add('border-dashed', 'bg-surface-container-high', 'border-outline-variant');
                        slot.innerHTML = `<span class="font-headline-md text-headline-md text-outline-variant/50">${i}</span>`;
                    }
                }

                // Handle Max Selections (Disable others)
                const allCards = document.querySelectorAll('.tarot-card');
                if (selectedCards.length === maxSelections) {
                    allCards.forEach(c => {
                        if (!c.classList.contains('selected')) {
                            c.classList.add('disabled');
                        }
                    });
                    
                    // Enable Action Button
                    actionBtn.classList.remove('opacity-50', 'cursor-not-allowed', 'bg-surface-variant', 'text-on-surface-variant');
                    actionBtn.classList.add('bg-primary', 'text-on-primary', 'hover:bg-primary-container', 'shadow-glow-primary', 'cursor-pointer', 'animate-pulse');
                    
                } else {
                    allCards.forEach(c => c.classList.remove('disabled'));
                    
                    // Disable Action Button
                    actionBtn.classList.add('opacity-50', 'cursor-not-allowed', 'bg-surface-variant', 'text-on-surface-variant');
                    actionBtn.classList.remove('bg-primary', 'text-on-primary', 'hover:bg-primary-container', 'shadow-glow-primary', 'cursor-pointer', 'animate-pulse');
                }
            }

            actionBtn.addEventListener('click', () => {
                if (selectedCards.length === maxSelections) {
                    window.location.href = 'reading-result.html';
                }
            });
            
            // Adjust card spread layout visually
            const wrappers = document.querySelectorAll('.card-wrapper');
            wrappers.forEach((w, i) => {
                 // Distribute horizontally
                 const percent = (i / (totalCards - 1)) * 100;
                 w.style.left = `calc(${percent}% - 2rem)`; // adjust for card width
                 
                 // Create arc effect vertically
                 // Middle cards are higher up (lower bottom value)
                 const distanceFromCenter = Math.abs((totalCards/2) - i - 0.5);
                 const verticalOffset = Math.pow(distanceFromCenter, 1.8) * 2;
                 w.style.bottom = `-${verticalOffset}px`;
            });
        });
    </script>
